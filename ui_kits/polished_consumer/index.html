<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gidi Connect — Consumer App V2 (Polished)</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; margin: 0; background: #050505; }
  .stage { min-height: 100vh; padding: 36px 20px 60px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .caption { color: #9CA3AF; font-size: 12px; max-width: 540px; text-align: center; line-height: 1.55; font-family: var(--gc-font-body); letter-spacing: 0.04em; }
  .caption strong { color: #FACC15; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; font-family: var(--gc-font-display); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: linear-gradient(180deg, #FDE047, #EAB308); color: #18181B; font-weight: 800; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; box-shadow: 0 0 16px rgba(234,179,8,0.5); }
</style>
</head>
<body>

<div class="stage">
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="badge">V2 · Polished</span>
    <span style="color:#9CA3AF;font-size:13px;">Consumer app · Home / Social / Profile</span>
  </div>
  <div id="root"></div>
  <div class="caption">Tap the bottom nav to switch screens. Everything below uses live React components from <strong>ui_kits/polished_consumer/</strong> — same data shapes as the existing kit, but with bolder type, more glow, animated rings, and a richer feed/profile structure.</div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="Icon.jsx"></script>
<script type="text/babel" src="AppHeader.jsx"></script>
<script type="text/babel" src="StoryRail.jsx"></script>
<script type="text/babel" src="CategoryGrid.jsx"></script>
<script type="text/babel" src="VibeCheck.jsx"></script>
<script type="text/babel" src="TrendingVenues.jsx"></script>
<script type="text/babel" src="NewsRail.jsx"></script>
<script type="text/babel" src="TrafficAlert.jsx"></script>
<script type="text/babel" src="BottomNav.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="SocialScreen.jsx"></script>
<script type="text/babel" src="ProfileScreen.jsx"></script>

<script type="text/babel" data-presets="react">
function ExplorePlaceholder() {
  return (
    <div className="gc2-screen">
      <AppHeaderV2 title="Explore" />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 28, textAlign: 'center' }}>
        <div style={{
          width: 96, height: 96, borderRadius: 24,
          background: 'rgba(234,179,8,0.12)', color: '#FACC15',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          marginBottom: 16, boxShadow: '0 0 24px rgba(234,179,8,0.25)',
        }}>
          <Icon name="search" size={44} />
        </div>
        <div style={{ fontSize: 20, fontWeight: 800, color: '#fff' }}>Explore Lagos</div>
        <div style={{ fontSize: 13, color: '#9CA3AF', marginTop: 8, maxWidth: 280 }}>The full Explore view lives in the existing kit. Stubbed here so the nav still works.</div>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = React.useState('home');
  const screen =
    tab === 'home'    ? <HomeScreenV2 onPickCategory={() => setTab('explore')} /> :
    tab === 'explore' ? <ExplorePlaceholder /> :
    tab === 'social'  ? <SocialScreenV2 /> :
    tab === 'profile' ? <ProfileScreenV2 /> :
                        <HomeScreenV2 />;

  return (
    <IOSDevice width={402} height={874} dark={true}>
      <div style={{
        position: 'absolute', inset: 0,
        background: '#000', color: '#fff',
        display: 'flex', flexDirection: 'column',
        overflow: 'hidden',
      }}>
        <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden' }}>
          {screen}
        </div>
        <BottomNavV2 active={tab} onChange={setTab} />
      </div>
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
