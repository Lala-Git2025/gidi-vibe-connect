project_id = "xvtjcpwkrsoyrhhptdmc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[functions.fetch-venues]
verify_jwt = false

[functions.search-places]
verify_jwt = false

[functions.fetch-lagos-events]
verify_jwt = false

[functions.scrape-lagos-venues]
verify_jwt = false

# Both traffic functions are called by pg_cron through pg_net, which mints no
# user token — so JWT verification must stay off and the x-cron-secret header
# is the gate instead. Declared here rather than relying on the deploy flag:
# both were deployed with --no-verify-jwt, and a later `supabase functions
# deploy <name>` without that flag would silently re-enable verification and
# leave the cron 401ing while pg_cron still logged every run as "succeeded".
[functions.live-traffic]
verify_jwt = false

[functions.lagos-traffic]
verify_jwt = false