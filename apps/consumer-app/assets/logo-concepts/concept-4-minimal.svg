<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EAB308"/>
      <stop offset="100%" style="stop-color:#CA8A04"/>
    </linearGradient>
    <linearGradient id="dark4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
  </defs>

  <!-- GOLD background — stands out immediately in app stores -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg4)"/>

  <!-- Bold black "G" with integrated connection nodes -->
  <!-- Main G shape — thick, modern, geometric -->
  <path d="M512 200
    A312 312 0 1 0 740 570
    L570 570
    L570 512
    A150 150 0 1 1 512 340"
    fill="none" stroke="url(#dark4)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connection hub dot in center -->
  <circle cx="490" cy="512" r="44" fill="#0A0A0A"/>

  <!-- Inner ring around hub -->
  <circle cx="490" cy="512" r="64" fill="none" stroke="#0A0A0A" stroke-width="6" opacity="0.3"/>

  <!-- Three connection lines radiating out -->
  <line x1="490" y1="448" x2="490" y2="360" stroke="#0A0A0A" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="545" y1="540" x2="610" y2="590" stroke="#0A0A0A" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="435" y1="540" x2="370" y2="590" stroke="#0A0A0A" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <!-- People dots at connection endpoints -->
  <circle cx="490" cy="348" r="16" fill="#0A0A0A" opacity="0.7"/>
  <circle cx="620" cy="600" r="16" fill="#0A0A0A" opacity="0.7"/>
  <circle cx="360" cy="600" r="16" fill="#0A0A0A" opacity="0.7"/>
</svg>
