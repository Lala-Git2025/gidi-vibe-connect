<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7DC6F"/>
      <stop offset="50%" style="stop-color:#EAB308"/>
      <stop offset="100%" style="stop-color:#CA8A04"/>
    </linearGradient>
    <linearGradient id="glow1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#EAB308;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#EAB308;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg1)"/>

  <!-- Subtle glow behind the mark -->
  <circle cx="512" cy="480" r="280" fill="url(#glow1)"/>

  <!-- Stylized "G" that doubles as a connection/pulse symbol -->
  <!-- Outer ring (broken circle suggesting connection) -->
  <path d="M512 220
    A292 292 0 1 0 720 580"
    fill="none" stroke="url(#gold1)" stroke-width="52" stroke-linecap="round"/>

  <!-- Inner horizontal bar of G + pulse/heartbeat line -->
  <path d="M540 580 L620 580 L660 480 L700 640 L740 520 L780 580"
    fill="none" stroke="url(#gold1)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Three small dots suggesting connection/people -->
  <circle cx="340" cy="760" r="24" fill="#EAB308" opacity="0.5"/>
  <circle cx="512" cy="800" r="32" fill="#EAB308" opacity="0.7"/>
  <circle cx="684" cy="760" r="24" fill="#EAB308" opacity="0.5"/>

  <!-- Connecting lines between dots -->
  <line x1="364" y1="760" x2="480" y2="800" stroke="#EAB308" stroke-width="4" opacity="0.3"/>
  <line x1="544" y1="800" x2="660" y2="760" stroke="#EAB308" stroke-width="4" opacity="0.3"/>
</svg>
