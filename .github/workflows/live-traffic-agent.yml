name: Live Traffic Agent (Manual / Fallback)

# The quantitative half of the traffic feature: Google Routes API travel-time
# readings for a curated set of Lagos corridors. Pairs with traffic-agent.yml
# (the radio-narrative half) — see scripts/live-traffic-agent.js for why both.
#
# ── NO LONGER SCHEDULED. pg_cron owns the cadence now. ──────────────────────
#
# This ran every 2 hours at :30 and the readings it produced are what condemned
# the arrangement. Measured over 17.6 days of traffic_route_readings:
#
#     scheduled   12 runs/day          (cron: '30 */2 * * *')
#     delivered    4.7 runs/day
#     average gap  5.2 hours
#     worst gap    9.1 hours
#
# GitHub throttles free-tier scheduled workflows under load, so the cron
# expression was decorative — asking for every 5 minutes would have produced
# the same 5 hours. The previous version of this header already named the fix:
# pg_cron plus an edge function, not a tighter cron. That is now done, in
# migration 20261006010000 and supabase/functions/live-traffic, at a real
# 15-minute interval (768 Compute Routes calls/day).
#
# ── Why this workflow is kept rather than deleted ───────────────────────────
#
# Two jobs ran against one quota would double-count, so the schedule is gone —
# but the script stays useful:
#
#   * `node scripts/live-traffic-agent.js` with no flags is a DRY RUN. It
#     fetches every corridor, prints a table of durations, severities and
#     baseline comparisons, and writes nothing. That is the fastest way to see
#     whether the Routes API key and quota are healthy.
#   * workflow_dispatch here is the fallback path if the edge function or
#     pg_net is down. Running it writes a real reading, same as the cron does.
#
# Historic note worth keeping: the original hourly schedule was 192 calls/day
# against a `ComputeRoutesRequestsPerDay` quota of 100, so it had been 429-ing
# through the back half of every day — masked by the very throttling described
# above. Raising that quota in the Cloud Console is free and is a prerequisite
# for both the 15-minute cadence and a full baseline build.

on:
  workflow_dispatch:

jobs:
  live-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Read live route times
        run: node scripts/live-traffic-agent.js --apply
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
